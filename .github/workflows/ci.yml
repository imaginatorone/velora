name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends
          libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev
          libudev-dev libfribidi-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev
          libwayland-dev libdecor-0-dev liburing-dev fonts-dejavu-core

      - name: Configure
        run: cmake --preset release -DVELORA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release --config Release --parallel 2

      - name: Test
        run: ctest --preset release -C Release

      - name: Verify install layout
        run: cmake --install out/build/release --config Release --prefix out/package
